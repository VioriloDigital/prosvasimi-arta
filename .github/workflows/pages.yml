name: Δημοσίευση online (GitHub Pages)

# Χτίζει την εφαρμογή και ενημερώνει το branch gh-pages, από το οποίο το GitHub Pages
# σερβίρει τη σελίδα https://viorilodigital.github.io/prosvasimi-arta/
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: |
          npm ci
          npm test
          npm run build:local
          touch dist-static/.nojekyll
          rm -f dist-static/_headers
      - name: Update gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist-static
          force_orphan: true
          commit_message: "Online έκδοση από ${{ github.sha }}"
